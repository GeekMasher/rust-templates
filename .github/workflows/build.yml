name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        template: ["actions", "cli", "web-server"]

    steps:
    - uses: actions/checkout@v4

    - name: Build
      env:
        TEMPLATE: ${{ matrix.template }}
      run: |
        set -e

        mkdir -p "./examples"
        cd "./examples"

        cargo install cargo-generate

        cargo generate \
          --path "../${TEMPLATE}" \
          --name "${TEMPLATE}"

