[package]
name = "{{project-name}}"
version = "0.1.0"
edition = "2024"

rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Server framework
rocket = { version = "^0.5", features = [
    "tls",
    "json",
] }
tokio = { version = "1", features = ["full"] }
# Database ORM
geekorm = { version = "^0.11", features = ["all", "backends-tokio"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Error handling
thiserror = "2"
# Logging
log = { version = "0.4", features = ["std", "serde"] }
env_logger = "0.11"
